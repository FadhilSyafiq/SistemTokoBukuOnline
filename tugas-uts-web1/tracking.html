<head>
    <meta charset="utf-8">

    <link rel="stylesheet" href="style.css">

        <section class="page-heading">
            <div>
                <h1>Tracking Pengiriman</h1>

            </div>

        <section class="card">

            <p class="muted small">Nomor contoh dari data.js: <strong>20230012</strong> dan <strong>20230013</strong>.
            </p>
        </section>
        <section id="trackingResult" class="hidden" style="margin-top:20px">
            <div id="trackingDetails"></div>
        </section>
